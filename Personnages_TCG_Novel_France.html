<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Personnages TCG Novel France</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout : liste filtrable à gauche, fiche personnage (photos) à droite. Outil interne, sans cartes. */
:root {
  --bg: #f2f3f8; --panel: #ffffff; --fg: #171b2d; --muted: #5a6182; --line: #d8dbe9;
  --accent: #2f47c2; --accent-fg: #ffffff; --soft: #e7eaf8; --hover: #eef0fa;
  --ok: #1d7648; --ok-soft: #dff2e7; --err: #b3261e; --err-soft: #fbe3e1;
  --r-divin: #8a6100; --r-mythique: #a3185f; --r-legendaire: #b4510a; --r-epique: #6a3bbd;
  --r-rare: #1b64ad; --r-peu: #23724a; --r-commun: #5a6182;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e111f; --panel: #161a2d; --fg: #e8eaf6; --muted: #98a0c6; --line: #2a3050;
    --accent: #93a3ff; --accent-fg: #0e111f; --soft: #20264a; --hover: #1c2140;
    --ok: #6fd39b; --ok-soft: #173326; --err: #ff9d95; --err-soft: #3a1b1a;
    --r-divin: #f0c14b; --r-mythique: #ff7fbf; --r-legendaire: #ffa05a; --r-epique: #b79bff;
    --r-rare: #78b8f5; --r-peu: #6fd39b; --r-commun: #98a0c6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e111f; --panel: #161a2d; --fg: #e8eaf6; --muted: #98a0c6; --line: #2a3050;
  --accent: #93a3ff; --accent-fg: #0e111f; --soft: #20264a; --hover: #1c2140;
  --ok: #6fd39b; --ok-soft: #173326; --err: #ff9d95; --err-soft: #3a1b1a;
  --r-divin: #f0c14b; --r-mythique: #ff7fbf; --r-legendaire: #ffa05a; --r-epique: #b79bff;
  --r-rare: #78b8f5; --r-peu: #6fd39b; --r-commun: #98a0c6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font-ui);
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1480px; margin: 0 auto; display: grid; gap: 12px; }

/* barre du haut */
.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.top h1 { font: 600 22px/1.1 var(--font-head); letter-spacing: .01em; margin: 0; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 12px;
  cursor: pointer; font-weight: 500; display: inline-flex; gap: 6px; align-items: center;
}
.btn:hover:not(:disabled) { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.small { padding: 4px 8px; font-size: 12.5px; }
a.btn { text-decoration: none; color: var(--fg); }
.btn.ghost { background: transparent; }

/* progression */
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; color: var(--muted); font-size: 13px; }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { flex: 1 1 200px; min-width: 160px; height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); width: 0; }
.mode { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--soft); color: var(--muted); }
.mode.warn { background: var(--err-soft); color: var(--err); }

/* bandeau */
.banner { border: 1px solid var(--line); background: var(--soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.banner p { margin: 0; flex: 1 1 280px; }
.banner.err { background: var(--err-soft); border-color: var(--err); }
.banner.demo { border-style: dashed; }

/* filtres */
.filters { display: grid; grid-template-columns: minmax(180px, 2fr) repeat(4, minmax(130px, 1fr)); gap: 8px; }
.filters input, .filters select {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--panel);
  border-radius: 6px; padding: 7px 9px;
}

/* disposition */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
.layout.has-detail { grid-template-columns: minmax(0, 1fr) minmax(340px, 440px); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

/* tableau */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th {
  text-align: left; font: 600 11.5px/1 var(--font-ui); letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr[aria-selected="true"] { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
td.name { font-weight: 600; min-width: 150px; }
td.work { min-width: 150px; color: var(--muted); }
td.desc { color: var(--muted); max-width: 340px; }
td.desc span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.thumb { position: relative; width: 44px; height: 58px; border-radius: 4px; overflow: hidden; background: var(--soft); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .noimg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 9.5px; line-height: 1.15; color: var(--muted); padding: 3px; }
.pill {
  display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--rc, var(--r-commun)); background: color-mix(in srgb, var(--rc, var(--r-commun)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--rc, var(--r-commun)) 35%, transparent);
}
.pill[data-r="Divin"] { --rc: var(--r-divin); } .pill[data-r="Mythique"] { --rc: var(--r-mythique); }
.pill[data-r="Légendaire"] { --rc: var(--r-legendaire); } .pill[data-r="Épique"] { --rc: var(--r-epique); }
.pill[data-r="Rare"] { --rc: var(--r-rare); } .pill[data-r="Peu commun"] { --rc: var(--r-peu); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.chip.on { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; color: var(--muted); font-size: 13px; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty h2 { margin: 0; font: 600 18px/1.2 var(--font-head); color: var(--fg); }
.empty p { margin: 0; max-width: 56ch; }

/* fiche */
.detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 14px; display: grid; gap: 14px; }
.detail header { display: flex; gap: 10px; justify-content: space-between; align-items: start; }
.detail h2 { margin: 0; font: 600 21px/1.15 var(--font-head); text-wrap: balance; }
.detail .work { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 13px; }
.meta .mono { font-family: var(--font-mono); color: var(--fg); }
.detail h3 { margin: 0 0 6px; font: 600 11.5px/1 var(--font-ui); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.detail p.desc { margin: 0; white-space: pre-wrap; }
.choice { display: grid; gap: 6px; }
.choice .row { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.choice .lbl { font-weight: 600; }
.choice .url { font-family: var(--font-mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile.is-primary { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.tile.is-backup { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok); }
.tile .thumb { width: 100%; height: auto; aspect-ratio: 3 / 4; }
.tile .thumb .noimg { font-size: 11.5px; }
.tile-meta { display: flex; gap: 4px; min-height: 18px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: var(--accent-fg); }
.badge.backup { background: var(--ok); color: var(--bg); }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); }
.tile-actions { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tile-actions a { font-size: 12px; color: var(--accent); margin-left: auto; }
.add { display: grid; gap: 6px; }
.add textarea { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 8px; font: 12.5px/1.4 var(--font-mono); }
.chip.mod { background: var(--soft); color: var(--accent); font-weight: 600; }
.rarrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rarrow select, .gifadd input { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; min-width: 0; }
.gifadd { display: grid; gap: 6px; }
.gifadd .line { display: flex; gap: 6px; }
.gifadd input { flex: 1; font: 12.5px var(--font-mono); }
.hint { color: var(--muted); font-size: 12.5px; margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; z-index: 30; max-width: min(92vw, 520px); font-size: 13px; }
.toast.err { background: var(--err); color: #fff; }
.skeleton { padding: 40px; text-align: center; color: var(--muted); }

@media (max-width: 1000px) {
  .filters { grid-template-columns: 1fr 1fr; }
  .filters input { grid-column: 1 / -1; }
  .layout.has-detail { grid-template-columns: minmax(0, 1fr); }
  .detail {
    position: fixed; inset: 0; z-index: 20; max-height: none; border-radius: 0; border: 0;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
  }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap" id="app">
  <div class="top">
    <div>
      <h1>Personnages TCG Novel France</h1>
      <div class="sub">Liste des personnages possibles, avec une photo principale et une photo de secours à choisir pour chacun.</div>
    </div>
    <div class="actions">
      <input type="file" id="file" accept=".csv,.json,text/csv,text/plain,application/json" multiple hidden>
      <button class="btn" id="btn-import" type="button">Importer CSV + JSON</button>
      <button class="btn primary" id="btn-save" type="button">Sauvegarder</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div id="banners"></div>

  <div class="filters" id="filters">
    <input id="f-q" type="search" placeholder="Rechercher un personnage, une œuvre…" aria-label="Rechercher">
    <select id="f-work" aria-label="Œuvre"></select>
    <select id="f-rar" aria-label="Rareté"></select>
    <select id="f-photo" aria-label="Photos">
      <option value="">Toutes les photos</option>
      <option value="noprim">Sans photo principale</option>
      <option value="prim">Avec photo principale</option>
      <option value="nobackup">Sans photo de secours</option>
      <option value="backup">Avec photo de secours</option>
    </select>
    <select id="f-sort" aria-label="Tri">
      <option value="score">Tri : score décroissant</option>
      <option value="name">Tri : personnage A-Z</option>
      <option value="work">Tri : œuvre A-Z</option>
      <option value="rarity">Tri : rareté</option>
    </select>
  </div>

  <div class="layout" id="layout">
    <section class="panel" aria-label="Liste des personnages">
      <div class="tablewrap" id="list"><div class="skeleton">Chargement des personnages…</div></div>
      <div class="pager" id="pager" hidden></div>
    </section>
    <aside class="panel detail" id="detail" hidden aria-label="Fiche du personnage"></aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";
  var RARITIES = ["Divin", "Mythique", "Légendaire", "Épique", "Rare", "Peu commun", "Commun"];
  var PAGE = 100, CHUNK = 80;
  var COLS = {
    name: ["personnage", "nom", "name", "character", "nomduperso"],
    work: ["oeuvre", "uvre", "work", "novel", "titre", "title"],
    desc: ["description", "desc", "resume", "synopsis"],
    score: ["scorepopularite", "score", "popularite"],
    rarity: ["rarete", "rarity"],
    rscript: ["retescript", "raretescript"],
    rank: ["rang", "rank"],
    pin: ["urlpinterest", "pinterest"],
    img: ["urlimage", "image", "imageurl", "urlimageanilist"],
    has: ["aimage"],
    src: ["sourceimage"],
    imp: ["importancepersosur100", "importance"]
  };
  var $ = function (s, el) { return (el || document).querySelector(s); };

  function h(tag, props) {
    var e = document.createElement(tag);
    var p = props || {};
    Object.keys(p).forEach(function (k) {
      var v = p[k];
      if (v === false || v == null) return;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);
      for (var j = 0; j < kids.length; j++) {
        var c = kids[j];
        if (c == null || c === false) continue;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return e;
  }
  function norm(s) { return String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
  function normKey(s) { return norm(s).replace(/[^a-z0-9]/g, ""); }
  function hash(s, seed) {
    var x = seed >>> 0;
    for (var i = 0; i < s.length; i++) x = Math.imul(x ^ s.charCodeAt(i), 16777619) >>> 0;
    return x.toString(36);
  }
  function charId(name, work) {
    var k = norm(name) + "|" + norm(work);
    return "p" + hash(k, 2166136261) + hash(k.split("").reverse().join(""), 99991);
  }

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var first = text.split(/\r?\n/, 1)[0];
    var delim = first.split(";").length > first.split(",").length ? ";" : ",";
    var rows = [], row = [], f = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(f); f = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    var head = (rows.shift() || []).map(function (s) { return s.trim(); });
    return { head: head, rows: rows };
  }
  function mapFromHead(head) {
    var nk = head.map(normKey), m = {};
    Object.keys(COLS).forEach(function (k) {
      m[k] = -1;
      for (var i = 0; i < COLS[k].length && m[k] < 0; i++) m[k] = nk.indexOf(COLS[k][i]);
    });
    return m;
  }
  function csvCell(v) {
    v = v == null ? "" : String(v);
    return /[;"\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function buildChars(head, rows) {
    var m = mapFromHead(head), seen = {}, out = [];
    function get(r, k) { return m[k] >= 0 && r[m[k]] != null ? String(r[m[k]]).trim() : ""; }
    rows.forEach(function (r, i) {
      var name = get(r, "name"), work = get(r, "work");
      if (!name) return;
      var id = charId(name, work);
      if (seen[id]) { seen[id]++; id = id + "-" + seen[id]; } else seen[id] = 1;
      var desc = get(r, "desc");
      out.push({
        id: id, name: name, work: work, desc: desc,
        score: parseFloat(get(r, "score").replace(/\s/g, "").replace(",", ".")) || 0,
        rarity: get(r, "rarity"), rarityScript: get(r, "rscript") || get(r, "rarity"), rank: get(r, "rank"), imp: get(r, "imp"),
        pin: get(r, "pin"), img: get(r, "img"), i: i, v: r, wk: normKey(work),
        s: norm(name + " " + work + " " + desc)
      });
    });
    return out;
  }
  /* CSV de base mis à jour : les choix de l'équipe sont écrits dans les colonnes (créées si absentes) */
  function buildTable(chars, head, picks) {
    var oh = head.slice(), nk = head.map(normKey), m = mapFromHead(head), base = head.length;
    function col(name, known) {
      var i = known != null && known >= 0 ? known : nk.indexOf(normKey(name));
      if (i < 0) { i = oh.length; oh.push(name); }
      return i;
    }
    var imgI = col("url_image", m.img), secI = col("url_image_secours"), valI = col("photo_validee"),
        gifI = col("url_gif"), medI = col("media_principal"), rarI = col("rarete", m.rarity), rscI = col("rarete_script");
    var rows = [];
    chars.slice().sort(function (a, b) { return a.i - b.i; }).forEach(function (c) {
      var r = oh.map(function (_, j) { return j < base && c.v[j] != null ? c.v[j] : ""; });
      var p = picks[c.id] || {}, prim = p.primary || "", final = prim || c.img || "";
      r[imgI] = final;
      if (m.has >= 0) r[m.has] = final ? "oui" : "non";
      if (m.src >= 0 && prim) r[m.src] = "choix_equipe";
      r[secI] = p.backup || "";
      r[valI] = prim ? "oui" : "non";
      var fr = p.rarity || c.rarity;
      r[rarI] = fr; r[rscI] = c.rarityScript || c.rarity;
      r[gifI] = p.gif || "";
      r[medI] = (fr === "Divin" && p.gif && p.showGif) ? p.gif : final;
      rows.push(r);
    });
    return { head: oh, rows: rows };
  }

  /* ---------- stockage ---------- */
  function localStore(persist) {
    var chars = null, picks = {}, works = [], cbC = null, cbP = null, cbW = null;
    if (persist) {
      try {
        chars = JSON.parse(localStorage.getItem("tgc_chars") || "null");
        picks = JSON.parse(localStorage.getItem("tgc_picks") || "{}") || {};
        works = JSON.parse(localStorage.getItem("tgc_works") || "[]") || [];
      } catch (e) { chars = null; picks = {}; works = []; }
    }
    function save() {
      if (!persist) return;
      try {
        localStorage.setItem("tgc_chars", JSON.stringify(chars));
        localStorage.setItem("tgc_picks", JSON.stringify(picks));
        localStorage.setItem("tgc_works", JSON.stringify(works));
      } catch (e) { notify("Stockage local plein ou bloqué : les choix ne seront pas conservés.", true); }
